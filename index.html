<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Absensi PGRI" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Sistem Presensi & Pantau Anak SMP PGRI 1 Cikadu</title>
    <meta name="description" content="Sistem presensi digital sekolah, jurnal mengajar guru, dan dashboard Pantau Anak untuk orang tua memonitor kehadiran, nilai, jadwal, dan tugas siswa." />
    <meta property="og:title" content="Sistem Presensi & Pantau Anak SMP PGRI 1 Cikadu" />
    <meta property="og:description" content="Sistem presensi digital sekolah, jurnal mengajar guru, dan dashboard Pantau Anak untuk orang tua memonitor kehadiran, nilai, jadwal, dan tugas siswa." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      // Tangkap event instalasi PWA sedini mungkin agar tombol Instal Aplikasi Android selalu siap
      window.__deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });

      // Bersihkan cache lama dan daftarkan Service Worker ringan (Mode Online Real-Time) untuk PWA Android
      if ('serviceWorker' in navigator) {
        if (window.caches) {
          caches.keys().then(function(keys) {
            for (var i = 0; i < keys.length; i++) {
              caches.delete(keys[i]);
            }
          });
        }
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }

      // Gracefully ignore Vite development HMR WebSocket notifications in iframe/cloud environments
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        if (
          reason &&
          (String(reason).includes('WebSocket') ||
           String(reason.message || '').includes('WebSocket') ||
           String(reason).includes('failed to connect to websocket'))
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('[vite] failed to connect to websocket')
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
