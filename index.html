    <meta property="og:title" content="Sistem Presensi & Pantau Anak SMP PGRI 1 Cikadu" />
    <meta property="og:description" content="Sistem presensi digital sekolah, jurnal mengajar guru, dan dashboard Pantau Anak untuk orang tua memonitor kehadiran, nilai, jadwal, dan tugas siswa." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Cabut otomatis semua Service Worker lama agar koneksi database Firestore kembali instan & langsung
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        }).catch(function() {});
      }

      // Gracefully ignore Vite development HMR WebSocket notifications in iframe/cloud environments
      (function() {
        var isViteWsNoise = function(val) {
          if (!val) return false;
          var str = typeof val === 'string' ? val : (val.message || val.stack || String(val));
          return (
            str.indexOf('WebSocket closed without opened') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1 ||
            (str.indexOf('[vite]') !== -1 && str.indexOf('WebSocket') !== -1)
          );
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteWsNoise(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isViteWsNoise(event.message) || isViteWsNoise(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteWsNoise(arguments[i])) return;
          }
          return origConsoleError.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
