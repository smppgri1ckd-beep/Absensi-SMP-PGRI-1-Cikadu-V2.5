    <script>
      // Gracefully ignore Vite development HMR WebSocket notifications in iframe/cloud environments
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        if (
          reason &&
          (String(reason).includes('WebSocket') ||
           String(reason.message || '').includes('WebSocket') ||
           String(reason).includes('failed to connect to websocket'))
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('[vite] failed to connect to websocket')
        ) {
          event.preventDefault();
        }
      });
    </script>
